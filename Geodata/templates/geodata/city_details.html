<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{name}}</title>
</head>
<body>

  <ul>
    <h1>{{name}}</h1>
    <li><strong>{{population}}</strong></li>
    {% if population > 1000000 %}
      <li>Big City </li>
    {% else %}
        <li>Medium City </li> 
    {% endif %}
  </ul>
 
</body>
</html>
